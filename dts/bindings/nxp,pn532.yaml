description: |
  NXP PN532 NFC Controller connected over UART.
  This binding supports the PN532 NFC module for reading and writing NFC tags.

compatible: "nxp,pn532"

include: [base.yaml, uart-device.yaml]

properties:
  current-speed:
    type: int
    required: false
    description: UART baudrate for the PN532 (default is 115200)