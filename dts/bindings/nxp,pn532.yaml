description: |
  NXP PN532 NFC controller connected over UART (HSU mode).
  Supports communication with NFC tags and devices.

compatible: "nxp,pn532"

include: [base.yaml, uart-device.yaml]

properties:
  irq-gpios:
    type: phandle-array
    required: false
    description: |
      Optional IRQ line from the PN532 indicating data ready.

  reset-gpios:
    type: phandle-array
    required: false
    description: |
      Optional reset pin for the PN532.