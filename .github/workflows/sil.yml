name: SiL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sil:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout module repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          manifest-file-name: west.yml
          toolchains: arm-zephyr-eabi

      - name: Build SiL test application
        run: |
          west build -b native_sim tests/drivers/pn532/sil -d tests/drivers/pn532/sil/build/

      - name: Run Software in Loop test
        run: |
          python tests/drivers/pn532/sil/scripts/pn532_device.py --port /dev/pts/1 & ./tests/drivers/pn532/sil/build/zephyr/zephyr.exe
